<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tomi Abe Email Signature</title>
  <style>
    @font-face {
      font-family: 'Sanchez';
      src: url('https://studio.tomiabe.com/assets/email-signature/fonts/Sanchez-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
  </style>
</head>
<body style="margin:0; padding:32px; background:#f4f4f5;">
  <!-- Copy from this table when adding the signature to an email client. -->
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="560" style="width:560px; max-width:560px; border-collapse:separate; border-spacing:0; background:#09090b; color:#fafafa; font-family:Satoshi, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; mso-line-height-rule:exactly;">
    <tr>
      <td width="22" style="width:22px; font-size:0; line-height:0;">&nbsp;</td>
      <td width="104" height="160" valign="middle" style="width:104px; height:160px; padding:0;">
        <img src="https://studio.tomiabe.com/images/tomi-profile-1.jpg" width="92" height="108" alt="Tomi Abe" style="display:block; width:92px; height:108px; object-fit:cover; border:1px solid #27272a; border-radius:12px;">
      </td>
      <td width="22" style="width:22px; font-size:0; line-height:0;">&nbsp;</td>
      <td width="1" height="88" valign="middle" style="width:1px; padding:0;">
        <div style="width:1px; height:88px; background:#27272a; font-size:0; line-height:0;">&nbsp;</div>
      </td>
      <td width="24" style="width:24px; font-size:0; line-height:0;">&nbsp;</td>
      <td width="220" valign="middle" style="width:220px; padding:0;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="220" style="width:220px; border-collapse:collapse;">
          <tr>
            <td style="padding:0 0 6px 0; font-family:'Sanchez', Georgia, serif; font-size:24px; line-height:27px; font-weight:400; letter-spacing:0.1px; color:#fafafa; white-space:nowrap;">
              Tomi Abe,
            </td>
          </tr>
          <tr>
            <td style="padding:0 0 9px 0; font-family:Satoshi, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size:13.5px; line-height:18px; font-weight:500; color:#a1a1aa; white-space:nowrap;">
              Principal, Tomi Abe Studio
            </td>
          </tr>
          <tr>
            <td style="padding:0 0 13px 0;">
              <div style="height:1px; width:208px; background:#27272a; font-size:0; line-height:0;">&nbsp;</div>
            </td>
          </tr>
          <tr>
            <td style="padding:0; font-family:Satoshi, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size:12px; line-height:17px; font-weight:400; color:#a1a1aa; white-space:nowrap;">
              <a href="https://studio.tomiabe.com/" target="_blank" style="color:#a1a1aa; text-decoration:none; border:0;">studio.tomiabe.com</a>
              <span style="display:inline-block; padding:0 8px; color:#27272a;">&#8226;</span>
              <a href="mailto:studio@tomiabe.com" style="color:#a1a1aa; text-decoration:none; border:0;">studio@tomiabe.com</a>
            </td>
          </tr>
        </table>
      </td>
      <td width="26" style="width:26px; font-size:0; line-height:0;">&nbsp;</td>
      <td width="108" valign="middle" align="center" style="width:108px; padding:0;">
        <img src="https://studio.tomiabe.com/favicon.png" width="96" height="96" alt="Tomi Abe Studio logo" style="display:block; width:96px; height:96px; border:1px solid #27272a; border-radius:48px; background:#000000;">
      </td>
      <td width="27" style="width:27px; font-size:0; line-height:0;">&nbsp;</td>
    </tr>
  </table>
</body>
</html>
