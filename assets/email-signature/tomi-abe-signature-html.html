<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tomi Abe Email Signature</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sanchez&display=swap" rel="stylesheet">
</head>
<body style="margin:0; padding:32px; background:#f4f4f5;">
  <!-- Copy from this table when adding the signature to an email client. -->
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="640" style="width:640px; max-width:640px; border-collapse:separate; border-spacing:0; background:#09090b; color:#fafafa; font-family:Satoshi, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; mso-line-height-rule:exactly;">
    <tr>
      <td width="32" style="width:32px; font-size:0; line-height:0;">&nbsp;</td>
      <td width="117" height="200" valign="middle" style="width:117px; height:200px; padding:0;">
        <img src="https://studio.tomiabe.com/images/tomi-profile-1.jpg" width="109" height="127" alt="Tomi Abe" style="display:block; width:109px; height:127px; object-fit:cover; border:1px solid #27272a; border-radius:12px;">
      </td>
      <td width="28" style="width:28px; font-size:0; line-height:0;">&nbsp;</td>
      <td width="1" height="108" valign="middle" style="width:1px; padding:0;">
        <div style="width:1px; height:108px; background:#27272a; font-size:0; line-height:0;">&nbsp;</div>
      </td>
      <td width="29" style="width:29px; font-size:0; line-height:0;">&nbsp;</td>
      <td width="234" valign="middle" style="width:234px; padding:0;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="234" style="width:234px; border-collapse:collapse;">
          <tr>
            <td style="padding:0 0 9px 0; font-family:'Sanchez', Georgia, serif; font-size:27px; line-height:30px; font-weight:400; letter-spacing:0.1px; color:#fafafa; white-space:nowrap;">
              Tomi Abe,
            </td>
          </tr>
          <tr>
            <td style="padding:0 0 12px 0; font-family:Satoshi, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size:14.5px; line-height:19px; font-weight:500; color:#a1a1aa; white-space:nowrap;">
              Principal, Tomi Abe Studio
            </td>
          </tr>
          <tr>
            <td style="padding:0 0 17px 0;">
              <div style="height:1px; width:229px; background:#27272a; font-size:0; line-height:0;">&nbsp;</div>
            </td>
          </tr>
          <tr>
            <td style="padding:0; font-family:Satoshi, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size:13px; line-height:18px; font-weight:400; color:#a1a1aa; white-space:nowrap;">
              <a href="https://studio.tomiabe.com/" target="_blank" style="color:#a1a1aa; text-decoration:none; border:0;">studio.tomiabe.com</a>
              <span style="display:inline-block; padding:0 10px; color:#27272a;">&#8226;</span>
              <a href="mailto:studio@tomiabe.com" style="color:#a1a1aa; text-decoration:none; border:0;">studio@tomiabe.com</a>
            </td>
          </tr>
        </table>
      </td>
      <td width="37" style="width:37px; font-size:0; line-height:0;">&nbsp;</td>
      <td width="126" valign="middle" align="center" style="width:126px; padding:0;">
        <img src="https://studio.tomiabe.com/favicon.png" width="116" height="116" alt="Tomi Abe Studio logo" style="display:block; width:116px; height:116px; border:1px solid #27272a; border-radius:58px; background:#000000;">
      </td>
      <td width="36" style="width:36px; font-size:0; line-height:0;">&nbsp;</td>
    </tr>
  </table>
</body>
</html>
