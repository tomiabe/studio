<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200" role="img" aria-labelledby="title desc">
  <title id="title">Tomi Abe email signature</title>
  <desc id="desc">Tomi Abe, Principal, Tomi Abe Studio, studio.tomiabe.com, studio@tomiabe.com</desc>

  <defs>
    <clipPath id="portraitClip">
      <rect x="36" y="36" width="109" height="127" rx="12" />
    </clipPath>
    <clipPath id="logoClip">
      <circle cx="548" cy="100" r="61" />
    </clipPath>
    <pattern id="matteNoise" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="transparent" />
      <circle cx="1" cy="1" r="0.45" fill="#ffffff" opacity="0.045" />
      <circle cx="6" cy="5" r="0.35" fill="#ffffff" opacity="0.035" />
    </pattern>
    <style>
      .name {
        font-family: Sanchez, Georgia, serif;
        font-size: 27px;
        font-weight: 400;
        letter-spacing: 0.1px;
        fill: #fafafa;
      }
      .role {
        font-family: Satoshi, -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 14.5px;
        font-weight: 500;
        fill: #a1a1aa;
      }
      .meta {
        font-family: Satoshi, -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 13px;
        font-weight: 400;
        fill: #a1a1aa;
        text-decoration: none;
      }
      a .meta {
        fill: #a1a1aa;
        text-decoration: none;
      }
      a:hover .meta {
        fill: #fafafa;
      }
    </style>
  </defs>

  <rect width="640" height="200" fill="#09090b" />
  <rect width="640" height="200" fill="url(#matteNoise)" opacity="0.65" />

  <rect x="32" y="32" width="117" height="135" rx="15" fill="#050505" stroke="#27272a" stroke-width="0.75" />
  <image
    href="https://studio.tomiabe.com/images/tomi-profile-1.jpg"
    x="36"
    y="36"
    width="109"
    height="127"
    preserveAspectRatio="xMidYMid slice"
    clip-path="url(#portraitClip)"
  />

  <rect x="177" y="46" width="1" height="108" fill="#27272a" />

  <text class="name" x="207" y="72">Tomi Abe,</text>
  <text class="role" x="207" y="96">Principal, Tomi Abe Studio</text>
  <line x1="207" y1="108" x2="436" y2="108" stroke="#27272a" stroke-width="0.65" />

  <a href="https://studio.tomiabe.com/" target="_blank" rel="noopener noreferrer">
    <text class="meta" x="207" y="136">studio.tomiabe.com</text>
  </a>

  <circle cx="333" cy="132" r="1.6" fill="#27272a" />

  <a href="mailto:studio@tomiabe.com">
    <text class="meta" x="349" y="136">studio@tomiabe.com</text>
  </a>

  <circle cx="548" cy="100" r="61" fill="#000000" stroke="#27272a" stroke-width="0.65" />
  <image
    href="https://studio.tomiabe.com/favicon.png"
    x="490"
    y="42"
    width="116"
    height="116"
    preserveAspectRatio="xMidYMid meet"
    clip-path="url(#logoClip)"
  />
</svg>
