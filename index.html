<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tomi Abe Studio</title>
    <meta name="description" content="Tomi Abe Studio is an independent, systems-driven creative and digital practice turning complex systems into clear products, brands, and stories." />
    <meta name="keywords" content="design strategy, brand identity, product design, design engineering, creative technology" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tomi Abe Studio" />
    <meta property="og:description" content="Tomi Abe Studio is an independent, systems-driven creative and digital practice." />
    <meta property="og:image" content="https://studio.tomiabe.com/images/og-image.jpg" />
    <meta property="og:site_name" content="Tomi Abe Studio" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@tomiabe" />
    <meta name="twitter:image" content="https://studio.tomiabe.com/images/og-image.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QQNXSYX8TP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-QQNXSYX8TP');
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Manrope:wght@300;400;500;600;700&family=Sanchez&display=swap" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,301,400,401,500,501,700,701&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/onepage.css" />
  </head>
  <body>
    <div id="loading">
      <span class="loading-text">Loading</span>
    </div>

    <!-- TOP NAV -->
    <header class="topnav">
      <div class="topnav-inner">
        <button class="logo" data-nav="home">TOMI ABE STUDIO</button>
        <nav class="nav" aria-label="Main">
          <button class="nav-link" data-nav="home">Home</button>
          <button class="nav-link" data-nav="work">Work</button>
          <button class="nav-link" data-nav="projects">Projects</button>
          <button class="nav-link" data-nav="updates">Updates</button>
          <button class="nav-link" data-nav="info">Info</button>
          <button class="nav-link" data-nav="contact">Contact</button>
        </nav>
        <button class="nav-toggle" data-open-menu>MENU</button>
      </div>
    </header>

    <!-- MOBILE MENU -->
    <div id="mobile-menu" class="menu-wrap" aria-hidden="true">
      <div class="menu-backdrop" data-close-menu></div>
      <div class="menu-panel">
        <div class="menu-head">
          <button class="menu-close" data-close-menu></button>
        </div>
        <nav class="menu-nav">
          <button class="nav-link" data-nav="home">Home</button>
          <button class="nav-link" data-nav="work">Work</button>
          <button class="nav-link" data-nav="projects">Projects</button>
          <button class="nav-link" data-nav="updates">Updates</button>
          <button class="nav-link" data-nav="info">Info</button>
          <button class="nav-link" data-nav="contact">Contact</button>
        </nav>
        <div class="menu-footer">
          <button class="copy-email" data-copy-email>
            <span id="menu-email">studio@tomiabe.com</span>
            <span id="menu-copy-icon"></span>
          </button>
          <span class="clock" id="menu-clock"></span>
          <div class="socials" id="socials-menu"></div>
          <div class="menu-controls">
            <div class="theme-buttons">
              <button class="theme-btn" data-theme="morning" title="Morning"></button>
              <button class="theme-btn" data-theme="noon" title="Noon"></button>
              <button class="theme-btn" data-theme="evening" title="Evening"></button>
              <button class="theme-btn" data-theme="system" title="System"></button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <main class="site">
      <!-- HERO -->
      <section id="home" class="hero">
        <div id="hero-content"></div>
      </section>

      <!-- WORK -->
      <section id="work" class="section">
        <div class="section-head">
          <h2 class="section-title">Work</h2>
          <div class="filter-row" id="work-filters"></div>
        </div>
        <div class="grid-3" id="work-grid"></div>
      </section>

      <!-- PROJECTS -->
      <section id="projects" class="section">
        <div class="section-head">
          <h2 class="section-title">Projects</h2>
          <div class="filter-row" id="projects-filters"></div>
        </div>
        <div class="grid-3" id="projects-grid"></div>
      </section>

      <!-- UPDATES -->
      <section id="updates" class="section">
        <div class="section-head">
          <h2 class="section-title">Updates</h2>
          <div class="filter-row" id="updates-filters"></div>
        </div>
        <div class="grid-3" id="updates-grid"></div>
      </section>

      <!-- INFO -->
      <section id="info" class="section">
        <h2 class="section-title">Info</h2>
        <div class="info-grid" id="info-grid"></div>
      </section>

      <!-- CONTACT -->
      <section id="contact" class="section">
        <div class="contact-grid" id="contact-grid"></div>
      </section>

      <footer class="footer">
        <p class="footer-tagline">Objectivity · Clarity · Precision</p>
        <div class="theme-buttons">
          <button class="theme-btn" data-theme="morning" title="Morning"></button>
          <button class="theme-btn" data-theme="noon" title="Noon"></button>
          <button class="theme-btn" data-theme="evening" title="Evening"></button>
          <button class="theme-btn" data-theme="system" title="System"></button>
        </div>
        <p class="footer-copyright">© 2026 Tomi Abe Studio</p>
      </footer>
    </main>

    <!-- DETAIL DRAWER -->
    <div id="drawer" class="drawer-wrap" aria-hidden="true">
      <div class="drawer-backdrop" data-close-drawer></div>
      <aside class="drawer" role="dialog" aria-modal="true" aria-label="Item details">
        <div class="drawer-head">
          <button class="drawer-copylink" id="drawer-copy-link" data-copy-drawer-link title="Copy link to this project"></button>
          <button class="drawer-close" data-close-drawer></button>
        </div>
        <div class="drawer-body" id="drawer-body"></div>
      </aside>
    </div>

    <button id="back-to-top" class="back-to-top" data-nav="home" aria-label="Back to top"></button>

    <script src="js/data.js"></script>
    <script src="js/onepage.js"></script>
  </body>
</html>
